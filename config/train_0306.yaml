data:
  metadata: data/sabdab_zip/processed/sabdab_debug20/metadata.json
  pdb_dir: data/sabdab_zip/processed/pdb
  samples_dir: data/sabdab_zip/processed/sabdab_debug20/samples
  train_ids: data/sabdab_zip/processed/sabdab_debug20/split/train_prot_ids.txt
  val_ids: data/sabdab_zip/processed/sabdab_debug20/split/val_prot_ids.txt
  test_ids: data/sabdab_zip/processed/sabdab_debug20/split/test_prot_ids.txt
  train_clusters: data/sabdab_zip/processed/sabdab_debug20/split/train_prot_cluster.txt
  batch_size: 1
  num_workers: 0
  n_steps: 200
  # Smaller chunk lowers pair-attention peak memory at a moderate speed cost.
  forward_chunk_size: 16

model:
  ppi_ckpt: "/root/private_data/luog/codex/IgGM/checkpoints/esm_ppi_650m_ab.pth"
  design_ckpt: ""
  igso3_buffer: "/root/private_data/luog/codex/IgGM/checkpoints/igso3_buffer.pth"

optimizer:
  lr: 1.0e-4
  weight_decay: 1.0e-2
  grad_clip: 1.0

loss:
  gamma: 0.8
  loss_viol_weight: 0.02

metrics:
  dockq_threshold: 0.23

trainer:
  max_epochs: 10
  precision: bf16-mixed
  accelerator: gpu
  devices: [0]
  log_every_n_steps: 5
  accumulate_grad_batches: 1
  num_sanity_val_steps: 1

wandb:
  disabled: true
  project: IgGM
  run_name: iggm-stage_time
  entity: "mllm-csu"
  api_key: ""

runtime:
  output_dir: outputs/lightning_train
  seed: 42
  resume: false
  run_test: true

stage_training:
  stage1_epochs: 1
  stage2_enable_seq_recovery: true
  mix_cdr_h3: 4
  mix_cdr_h1: 2
  mix_cdr_h2: 2
  mix_cdr_all: 2
  lazy_cache_size: 128

memory:
  # 0 disables hard filtering; set e.g. 1800 for explicit upper-bound handling.
  max_total_len: 0
  enable_activation_checkpoint: true
  # Graceful fallback on rare OOM spikes instead of terminating the entire epoch.
  skip_oom_batch: true
  clear_cache_on_oom: true
  # Debug-only memory diagnostics (off by default for speed).
  profiler_enabled: false
  profiler_log_every_n_steps: 10
  profiler_top_k_tensors: 6
  auto_chunk_on_oom: true
  min_chunk_size: 2
  featurizer_cpu_offload_on_oom: true
  feature_fp16: false
  enable_structure_checkpoint: true
