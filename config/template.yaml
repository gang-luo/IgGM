
data:
  metadata: data/sabdab_zip/processed/sabdab_debug20/metadata.json
  pdb_dir: data/sabdab_zip/processed/pdb
  samples_dir: data/sabdab_zip/processed/sabdab_debug20/samples
  train_ids: data/sabdab_zip/processed/sabdab_debug20/split/train_prot_ids.txt
  val_ids: data/sabdab_zip/processed/sabdab_debug20/split/val_prot_ids.txt
  test_ids: data/sabdab_zip/processed/sabdab_debug20/split/test_prot_ids.txt
  train_clusters: data/sabdab_zip/processed/sabdab_debug20/split/train_prot_cluster.txt
  batch_size: 2
  num_workers: 4
  n_steps: 200


model:
  # ppi_ckpt留空时，将自动下载并使用官方PPI预训练权重
  ppi_ckpt: "/root/private_data/luog/codex/IgGM/pretrain_ckpt/esm_ppi_650m_ab.pth"
  # design_ckpt可选：留空表示从随机初始化开始训练DesignModel
  design_ckpt: ""
  # 可选SO3 buffer，加速扩散旋转采样；留空则运行时动态计算
  igso3_buffer: "/root/private_data/luog/codex/IgGM/pretrain_ckpt/igso3_buffer.pth"

optimizer:
  lr: 1.0e-4
  weight_decay: 1.0e-2
  grad_clip: 1.0

loss:
  gamma: 0.8
  loss_viol_weight: 0.02

metrics:
  dockq_threshold: 0.23

trainer:
  max_epochs: 10
  precision: 16-mixed
  accelerator: auto
  devices: auto
  log_every_n_steps: 5

wandb:
  disabled: false
  project: IgGM
  run_name: iggm-stage_time
  entity: "mllm-csu"
  api_key: "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"


runtime:
  output_dir: outputs/lightning_train
  seed: 42
  resume: False
  run_test: true

stage_training:
  stage1_epochs: 3
  stage2_enable_seq_recovery: true
  mix_cdr_h3: 4
  mix_cdr_h1: 2
  mix_cdr_h2: 2
  mix_cdr_all: 2
  lazy_cache_size: 128
