seed: 2025

model:
  target: IgGM.training.DebugLightningModule
  params:
    input_dim: 16
    lr: 0.001

datamodule:
  target: IgGM.training.DebugDataModule
  params:
    input_dim: 16
    train_size: 64
    val_size: 16
    test_size: 16
    batch_size: 4
    num_workers: 0

trainer:
  accelerator: cpu
  devices: 1
  max_epochs: 2
  limit_train_batches: 5
  limit_val_batches: 2
  log_every_n_steps: 1
  enable_progress_bar: true
  default_root_dir: outputs/debug

checkpoint:
  dirpath: outputs/debug/checkpoints
  monitor: val_loss
  mode: min
  best_filename: best-{epoch:02d}-{val_loss:.4f}

infer:
  output_dir: outputs/debug/infer
  default_ckpt: outputs/debug/checkpoints/last.ckpt

evaluate:
  stage: validate
  json_output: outputs/debug/eval/metrics.json
