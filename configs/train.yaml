seed: 2025

model:
  target: IgGM.training.DebugLightningModule
  params:
    input_dim: 16
    lr: 0.0005

datamodule:
  target: IgGM.training.DebugDataModule
  params:
    input_dim: 16
    train_size: 50000
    val_size: 5000
    test_size: 5000
    batch_size: 64
    num_workers: 8

trainer:
  accelerator: gpu
  devices: 1
  precision: 16-mixed
  max_epochs: 100
  gradient_clip_val: 1.0
  accumulate_grad_batches: 1
  log_every_n_steps: 20
  default_root_dir: outputs/train

checkpoint:
  dirpath: outputs/train/checkpoints
  monitor: val_loss
  mode: min
  best_filename: best-{epoch:03d}-{val_loss:.4f}

infer:
  output_dir: outputs/train/infer
  default_ckpt: outputs/train/checkpoints/last.ckpt

evaluate:
  stage: validate
  json_output: outputs/train/eval/metrics.json
